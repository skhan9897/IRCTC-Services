services:
  - type: web
    name: irctc-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://<HOST>:3306/<DATABASE_NAME>?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        value: <DB_USERNAME>
      - key: SPRING_DATASOURCE_PASSWORD
        value: <DB_PASSWORD>
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
