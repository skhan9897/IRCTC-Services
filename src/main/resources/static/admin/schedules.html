<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Train Schedule | Railway Booking</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }


        /* ================= NAVBAR ================= */

        .navbar {

            min-height: 72px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 10px 6%;

            background: #fff;

            box-shadow:
                    0 2px 12px rgba(0,0,0,.08);
        }

        .logo {
            display: flex;
            flex-direction: column;
        }

        .logo strong {
            font-size: 26px;
        }

        .logo small {
            color: #777;
            font-size: 11px;
        }

        .navbar nav {
            display: flex;
            gap: 7px;
        }

        .navbar nav a {

            text-decoration: none;

            color: #333;

            padding: 9px 13px;

            border-radius: 7px;

            font-size: 14px;

            font-weight: 600;
        }

        .navbar nav a:hover,
        .navbar nav a.active {

            background: #e8eef7;

            color: #315b9b;
        }


        /* ================= CONTAINER ================= */

        .schedule-container {

            width: 100%;

            max-width: 1150px;

            margin: 35px auto;

            padding: 0 20px;
        }


        /* ================= TITLE ================= */

        .page-title {

            text-align: center;

            margin-bottom: 28px;
        }

        .page-title h1 {

            margin: 0 0 8px;

            font-size: 32px;
        }

        .page-title p {

            margin: 0;

            color: #777;

            font-size: 14px;
        }


        /* ================= SEARCH CARD ================= */

        .search-card {

            background: #fff;

            padding: 25px;

            border-radius: 13px;

            box-shadow:
                    0 5px 20px rgba(0,0,0,.07);

            margin-bottom: 25px;
        }

        .search-card h2 {

            margin: 0 0 20px;

            font-size: 20px;
        }

        .search-form {

            display: grid;

            grid-template-columns:
                1fr 1fr 1fr auto;

            gap: 15px;

            align-items: end;
        }

        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;
        }

        .form-group input {

            width: 100%;

            height: 45px;

            padding: 0 12px;

            border: 1px solid #d5d9df;

            border-radius: 7px;

            outline: none;

            font-size: 14px;
        }

        .form-group input:focus {

            border-color: #315b9b;

            box-shadow:
                    0 0 0 3px
                    rgba(49,91,155,.10);
        }

        .search-btn {

            height: 45px;

            padding: 0 25px;

            border: none;

            border-radius: 7px;

            background: #315b9b;

            color: white;

            font-weight: 700;

            cursor: pointer;
        }

        .search-btn:hover {

            background: #274d87;
        }


        /* ================= RESULTS ================= */

        .results-card {

            background: #fff;

            padding: 25px;

            border-radius: 13px;

            box-shadow:
                    0 5px 20px rgba(0,0,0,.07);
        }

        .results-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;
        }

        .results-header h2 {

            margin: 0;

            font-size: 21px;
        }

        .result-count {

            color: #777;

            font-size: 13px;
        }


        /* ================= SCHEDULE CARD ================= */

        .schedule-card {

            border: 1px solid #e1e5ea;

            border-radius: 11px;

            padding: 20px;

            margin-bottom: 15px;

            transition: .2s;
        }

        .schedule-card:hover {

            border-color: #b8c7dc;

            box-shadow:
                    0 4px 15px
                    rgba(0,0,0,.06);
        }

        .schedule-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 18px;
        }

        .train-name {

            font-size: 17px;

            font-weight: 800;
        }

        .train-number {

            display: block;

            margin-top: 5px;

            color: #777;

            font-size: 12px;
        }

        .schedule-date {

            padding: 7px 12px;

            background: #eef3fa;

            color: #315b9b;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;
        }


        /* ================= ROUTE ================= */

        .route {

            display: grid;

            grid-template-columns:
                1fr 70px 1fr;

            align-items: center;

            gap: 10px;

            margin-bottom: 18px;
        }

        .station {

            display: flex;

            flex-direction: column;

            gap: 5px;
        }

        .station:last-child {

            text-align: right;

            align-items: flex-end;
        }

        .station small {

            color: #888;

            font-size: 10px;

            font-weight: 700;
        }

        .station strong {

            font-size: 16px;
        }

        .station span {

            color: #555;

            font-size: 13px;
        }

        .route-line {

            text-align: center;

            color: #315b9b;

            font-size: 22px;

            font-weight: 800;
        }


        /* ================= DETAILS ================= */

        .schedule-details {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            padding-top: 15px;

            border-top: 1px solid #eee;
        }

        .detail {

            background: #f7f9fb;

            padding: 11px;

            border-radius: 7px;
        }

        .detail small {

            display: block;

            color: #888;

            font-size: 10px;

            margin-bottom: 5px;
        }

        .detail strong {

            font-size: 13px;
        }


        /* ================= LOADING ================= */

        .loading {

            text-align: center;

            padding: 40px;

            color: #777;
        }


        /* ================= MESSAGE ================= */

        .message {

            padding: 14px;

            border-radius: 7px;

            text-align: center;

            font-size: 13px;

            margin-bottom: 15px;
        }

        .message.error {

            background: #ffe5e5;

            color: #c62828;
        }

        .message.success {

            background: #e3f6e8;

            color: #187a35;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 850px) {

            .search-form {

                grid-template-columns:
                    1fr 1fr;
            }

            .search-btn {

                width: 100%;
            }

            .schedule-details {

                grid-template-columns:
                    1fr 1fr;
            }
        }


        @media (max-width: 600px) {

            .navbar {

                flex-direction: column;

                gap: 12px;

                padding: 15px;
            }

            .navbar nav {

                flex-wrap: wrap;

                justify-content: center;
            }

            .navbar nav a {

                font-size: 12px;

                padding: 8px 10px;
            }

            .schedule-container {

                margin: 25px auto;

                padding: 0 14px;
            }

            .page-title h1 {

                font-size: 26px;
            }

            .search-card,
            .results-card {

                padding: 18px 15px;
            }

            .search-form {

                grid-template-columns: 1fr;
            }

            .schedule-top {

                align-items: flex-start;

                gap: 10px;

                flex-direction: column;
            }

            .route {

                grid-template-columns:
                    1fr 40px 1fr;
            }

            .station strong {

                font-size: 14px;
            }

            .schedule-details {

                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo">

        <strong>
            🚆 Railway Booking
        </strong>

        <small>
            Train Reservation System
        </small>

    </div>


    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="search-train.html">
            Search Train
        </a>

        <a href="schedule.html"
           class="active">
            Schedule
        </a>

        <a href="my-bookings.html">
            My Bookings
        </a>

        <a href="profile.html">
            Profile
        </a>

    </nav>

</header>


<!-- ================= MAIN ================= -->

<main class="schedule-container">


    <!-- TITLE -->

    <div class="page-title">

        <h1>
            Train Schedule
        </h1>

        <p>
            Search trains and check their
            departure and arrival schedules.
        </p>

    </div>


    <!-- ================= SEARCH ================= -->

    <section class="search-card">

        <h2>
            Search Schedule
        </h2>


        <form
                id="scheduleSearchForm"
                class="search-form">


            <div class="form-group">

                <label for="from">
                    From Station
                </label>

                <input
                        type="text"
                        id="from"
                        name="from"
                        placeholder="Enter source station"
                        required>

            </div>


            <div class="form-group">

                <label for="to">
                    To Station
                </label>

                <input
                        type="text"
                        id="to"
                        name="to"
                        placeholder="Enter destination station"
                        required>

            </div>


            <div class="form-group">

                <label for="journeyDate">
                    Journey Date
                </label>

                <input
                        type="date"
                        id="journeyDate"
                        name="journeyDate"
                        required>

            </div>


            <button
                    type="submit"
                    class="search-btn">

                Search

            </button>


        </form>

    </section>


    <!-- ================= MESSAGE ================= -->

    <div
            id="scheduleMessage"
            style="display:none;">
    </div>


    <!-- ================= RESULTS ================= -->

    <section class="results-card">


        <div class="results-header">

            <h2>
                Available Schedules
            </h2>

            <span
                    id="resultCount"
                    class="result-count">

                0 schedules

            </span>

        </div>


        <div
                id="scheduleResults">

            <div class="loading">

                Search a route to view
                train schedules.

            </div>

        </div>


    </section>


</main>


<!-- ================= JS ================= -->

<script src="js/api.js"></script>

<script src="js/schedule.js"></script>


</body>

</html>
