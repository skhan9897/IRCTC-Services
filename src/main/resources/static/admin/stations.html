<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stations | Railway Booking</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 10px 6%;

            background: #fff;

            box-shadow:
                    0 2px 12px rgba(0,0,0,.08);
        }

        .logo {
            display: flex;
            flex-direction: column;
        }

        .logo strong {
            font-size: 25px;
        }

        .logo small {
            color: #777;
            font-size: 11px;
        }

        .navbar nav {
            display: flex;
            gap: 7px;
        }

        .navbar nav a {
            text-decoration: none;

            color: #333;

            padding: 9px 13px;

            border-radius: 7px;

            font-size: 14px;
            font-weight: 600;
        }

        .navbar nav a:hover,
        .navbar nav a.active {
            background: #e8eef7;
            color: #315b9b;
        }

        /* ================= CONTAINER ================= */

        .stations-container {
            width: 100%;
            max-width: 1100px;

            margin: 35px auto;

            padding: 0 20px;
        }

        /* ================= TITLE ================= */

        .page-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .page-title h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .page-title p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        /* ================= SEARCH ================= */

        .search-card {
            background: #fff;

            padding: 22px;

            border-radius: 13px;

            box-shadow:
                    0 5px 20px rgba(0,0,0,.07);

            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;

            height: 46px;

            padding: 0 14px;

            border: 1px solid #d5d9df;

            border-radius: 7px;

            outline: none;

            font-size: 14px;
        }

        .search-input:focus {
            border-color: #315b9b;

            box-shadow:
                    0 0 0 3px
                    rgba(49,91,155,.10);
        }

        /* ================= STATIONS GRID ================= */

        .stations-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;
        }

        .station-card {
            background: #fff;

            padding: 22px;

            border-radius: 12px;

            border: 1px solid #e5e8ed;

            box-shadow:
                    0 4px 15px rgba(0,0,0,.05);

            transition: .2s;
        }

        .station-card:hover {
            transform: translateY(-3px);

            border-color: #315b9b;

            box-shadow:
                    0 8px 20px rgba(0,0,0,.09);
        }

        .station-icon {
            width: 50px;
            height: 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #e8eef7;

            border-radius: 10px;

            font-size: 25px;

            margin-bottom: 15px;
        }

        .station-card h3 {
            margin: 0 0 7px;

            font-size: 17px;
        }

        .station-code {
            display: inline-block;

            padding: 5px 9px;

            margin-bottom: 10px;

            border-radius: 5px;

            background: #315b9b;

            color: white;

            font-size: 11px;

            font-weight: 800;
        }

        .station-card p {
            margin: 0;

            color: #777;

            font-size: 13px;
        }

        /* ================= LOADING ================= */

        .loading {
            grid-column: 1 / -1;

            text-align: center;

            padding: 40px;

            color: #777;
        }

        /* ================= MESSAGE ================= */

        .message {
            padding: 14px;

            margin-bottom: 20px;

            border-radius: 7px;

            text-align: center;

            font-size: 13px;
        }

        .error {
            background: #ffe5e5;
            color: #c62828;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 900px) {

            .stations-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
                padding: 15px;
            }

            .navbar nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .navbar nav a {
                font-size: 12px;
                padding: 8px 10px;
            }

            .stations-container {
                margin: 25px auto;
                padding: 0 14px;
            }

            .page-title h1 {
                font-size: 26px;
            }

            .stations-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo">

        <strong>
            🚆 Railway Booking
        </strong>

        <small>
            Train Reservation System
        </small>

    </div>


    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="search-train.html">
            Search Train
        </a>

        <a href="schedule.html">
            Schedule
        </a>

        <a href="stations.html"
           class="active">
            Stations
        </a>

        <a href="my-bookings.html">
            My Bookings
        </a>

    </nav>

</header>


<!-- ================= MAIN ================= -->

<main class="stations-container">


    <div class="page-title">

        <h1>
            Railway Stations
        </h1>

        <p>
            Search and view available railway stations.
        </p>

    </div>


    <!-- SEARCH -->

    <section class="search-card">

        <input
                type="text"
                id="stationSearch"
                class="search-input"
                placeholder="Search station by name, code or city...">

    </section>


    <div
            id="stationMessage"
            style="display:none;">
    </div>


    <!-- STATIONS -->

    <section
            id="stationsGrid"
            class="stations-grid">

        <div class="loading">
            Loading stations...
        </div>

    </section>


</main>


<script src="js/api.js"></script>

<script src="js/station.js"></script>


</body>

</html>
