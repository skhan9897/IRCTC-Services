<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Ticket | IRCTC Next Gen Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --irctc-blue: #213d77;
            --irctc-orange: #fb792b;
            --bg-light: #f0f2f5;
            --white: #ffffff;
            --text-muted: #777;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-light); margin: 0; display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: #002266; color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
        .sidebar-brand { padding: 30px 20px; display: flex; align-items: center; gap: 12px; }
        .sidebar-nav { list-style: none; padding: 0; margin: 0; flex: 1; }
        .sidebar-nav li a { padding: 14px 25px; display: flex; align-items: center; gap: 15px; color: rgba(255,255,255,0.7); text-decoration: none; }

        .main-content { margin-left: 260px; flex: 1; padding: 30px; }
        .booking-layout { display: grid; grid-template-columns: 1fr 350px; gap: 30px; }

        .card { background: var(--white); border-radius: 15px; box-shadow: var(--shadow); padding: 25px; margin-bottom: 25px; }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: var(--irctc-blue); display: flex; align-items: center; gap: 10px; }

        .train-summary { background: #f8f9fa; border-radius: 12px; padding: 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .summary-item label { display: block; font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .summary-item span { font-weight: 700; color: #333; }

        .passenger-form { border: 1px solid #eee; border-radius: 12px; padding: 20px; margin-bottom: 15px; position: relative; }
        .form-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; margin-top: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
        .form-group input, .form-group select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; }

        .add-btn { width: 100%; border: 2px dashed #213d77; background: transparent; padding: 12px; border-radius: 10px; cursor: pointer; color: var(--irctc-blue); font-weight: 600; }

        .fare-total { display: flex; justify-content: space-between; border-top: 2px solid #f0f2f5; padding-top: 20px; margin-top: 20px; font-size: 22px; font-weight: 800; color: var(--irctc-blue); }
        .book-btn { width: 100%; padding: 15px; background: var(--irctc-orange); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 25px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand"><h2>IRCTC</h2></div>
        <ul class="sidebar-nav">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="search-train.html">Search Trains</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="booking-layout">
            <div>
                <div class="card">
                    <div class="card-title"><i class="fas fa-train"></i> Journey Details</div>
                    <div class="train-summary">
                        <div class="summary-item"><label>Train</label><span id="sumTrain">-</span></div>
                        <div class="summary-item"><label>Date</label><span id="sumDate">-</span></div>
                        <div class="summary-item"><label>From</label><span id="sumFrom">-</span></div>
                        <div class="summary-item"><label>To</label><span id="sumTo">-</span></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title"><i class="fas fa-users"></i> Passenger Details</div>
                    <div id="passengerContainer"></div>
                    <button class="add-btn" onclick="addPassenger()">+ Add Passenger</button>
                </div>
            </div>

            <div>
                <div class="card">
                    <div class="card-title">Fare Summary</div>
                    <div id="fareList"></div>
                    <div class="fare-total"><span>Total Payable</span><span id="totalFare">₹0</span></div>
                    <button class="book-btn" onclick="bookNow()">Confirm Booking</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const train = JSON.parse(localStorage.getItem("selectedTrain"));
        const classType = localStorage.getItem("classType");
        const fare = parseFloat(localStorage.getItem("selectedFare"));
        const journeyDate = localStorage.getItem("journeyDate");

        function init() {
            if(!train) { window.location.href="search-train.html"; return; }
            document.getElementById("sumTrain").textContent = `${train.trainName} (#${train.trainNumber})`;
            document.getElementById("sumDate").textContent = journeyDate;
            document.getElementById("sumFrom").textContent = train.source;
            document.getElementById("sumTo").textContent = train.destination;
            addPassenger();
        }

        let pIdx = 0;
        function addPassenger() {
            pIdx++;
            const div = document.createElement("div");
            div.className = "passenger-form";
            div.innerHTML = `
                <h4 style="margin:0">Passenger #${pIdx}</h4>
                <div class="form-group" style="margin-top:15px">
                    <label>Full Name</label>
                    <input type="text" class="p-name" placeholder="Enter name">
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Age</label><input type="number" class="p-age"></div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select class="p-gender"><option>Male</option><option>Female</option><option>Other</option></select>
                    </div>
                </div>
            `;
            document.getElementById("passengerContainer").appendChild(div);
            updateFare();
        }

        function updateFare() {
            const count = document.querySelectorAll(".passenger-form").length;
            const total = count * fare;
            document.getElementById("totalFare").textContent = `₹${total}`;
        }

        async function bookNow() {
            const userId = localStorage.getItem("userId");
            const forms = document.querySelectorAll(".passenger-form");
            const passengers = [];

            for(let f of forms) {
                const name = f.querySelector(".p-name").value;
                const age = f.querySelector(".p-age").value;
                const gender = f.querySelector(".p-gender").value;
                if(!name || !age) { alert("Fill all details"); return; }
                passengers.push({ name, age: parseInt(age), gender });
            }

            const data = {
                userId: parseInt(userId),
                trainId: train.id,
                journeyDate: journeyDate,
                classType: classType,
                passengers: passengers
            };

            try {
                const res = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                localStorage.setItem("lastBooking", JSON.stringify(result));
                window.location.href = "payment.html";
            } catch (e) { alert("Booking failed"); }
        }

        init();
    </script>
</body>
</html>
