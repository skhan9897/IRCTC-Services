<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRCTC | Loading...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --irctc-blue: #213d77;
            --irctc-orange: #fb792b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2c4e91 0%, #1a2e5a 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            color: white;
        }

        .logo-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
        }

        .main-logo {
            font-size: 80px;
            color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .spin-ring {
            width: 100%;
            height: 100%;
            border: 6px solid rgba(255, 255, 255, 0.1);
            border-top: 6px solid var(--irctc-orange);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        .logo-icon-spin {
            animation: rotateLogo 3s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateLogo {
            0% { transform: translate(-50%, -50%) rotateY(0deg); }
            50% { transform: translate(-50%, -50%) rotateY(180deg); }
            100% { transform: translate(-50%, -50%) rotateY(360deg); }
        }

        .app-name {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 4px;
            margin: 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .tagline {
            font-size: 14px;
            opacity: 0.8;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            margin: 40px auto 0;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .loading-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: var(--irctc-orange);
            animation: progress 3s linear forwards;
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Fade out animation for the whole splash */
        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <div class="splash-container" id="splash">
        <div class="logo-wrapper">
            <div class="spin-ring"></div>
            <i class="fas fa-subway main-logo logo-icon-spin"></i>
        </div>

        <h1 class="app-name">IRCTC</h1>
        <p class="tagline">Next Generation Ticketing System</p>

        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                const userId = localStorage.getItem("userId");

                // Add fade out effect
                document.getElementById("splash").classList.add("fade-out");

                setTimeout(function() {
                    if (userId) {
                        window.location.href = "dashboard.html";
                    } else {
                        window.location.href = "home.html";
                    }
                }, 500); // Small delay for the fade animation

            }, 3000); // 3 seconds splash duration
        });
    </script>
</body>
</html>
