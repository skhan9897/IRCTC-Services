<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings - IRCTC</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        body {
            background: #f4f7fb;
        }

        .bookings-container {

            max-width: 1150px;

            margin: 40px auto;

            padding: 0 20px;
        }


        .page-header {

            background: white;

            padding: 28px;

            border-radius: 14px;

            margin-bottom: 25px;

            box-shadow:
                    0 5px 20px rgba(0,0,0,0.08);
        }


        .page-header h1 {

            margin-bottom: 8px;
        }


        .page-header p {

            color: #777;
        }


        .booking-card {

            background: white;

            border-radius: 14px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow:
                    0 5px 20px rgba(0,0,0,0.07);
        }


        .booking-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding-bottom: 18px;

            border-bottom: 1px solid #eee;

            margin-bottom: 20px;
        }


        .pnr {

            font-size: 18px;

            font-weight: 800;
        }


        .status {

            padding: 7px 14px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;
        }


        .confirmed {

            background: #e3f6e8;

            color: #187a35;
        }


        .pending {

            background: #fff3cd;

            color: #856404;
        }


        .cancelled {

            background: #ffe5e5;

            color: #c62828;
        }


        .journey {

            display: grid;

            grid-template-columns:
                1fr auto 1fr;

            gap: 20px;

            align-items: center;

            margin-bottom: 25px;
        }


        .station {

            background: #f6f8fb;

            padding: 18px;

            border-radius: 9px;
        }


        .station span {

            display: block;

            color: #777;

            font-size: 13px;

            margin-bottom: 7px;
        }


        .station strong {

            font-size: 19px;
        }


        .arrow {

            font-size: 25px;

            font-weight: bold;
        }


        .details {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 20px;
        }


        .detail-box {

            background: #f6f8fb;

            padding: 14px;

            border-radius: 8px;
        }


        .detail-box span {

            display: block;

            color: #777;

            font-size: 12px;

            margin-bottom: 5px;
        }


        .detail-box strong {

            font-size: 14px;
        }


        .actions {

            display: flex;

            gap: 12px;

            border-top: 1px solid #eee;

            padding-top: 18px;
        }


        .btn {

            border: none;

            border-radius: 7px;

            padding: 11px 20px;

            font-weight: 700;

            cursor: pointer;
        }


        .view-btn {

            background: #315b9b;

            color: white;
        }


        .cancel-btn {

            background: #ffe5e5;

            color: #c62828;
        }


        .empty {

            background: white;

            text-align: center;

            padding: 60px 20px;

            border-radius: 14px;

            box-shadow:
                    0 5px 20px rgba(0,0,0,0.07);
        }


        .empty-icon {

            font-size: 55px;

            margin-bottom: 15px;
        }


        .empty h2 {

            margin-bottom: 10px;
        }


        .empty p {

            color: #777;

            margin-bottom: 20px;
        }


        .search-btn {

            display: inline-block;

            text-decoration: none;

            background: #315b9b;

            color: white;

            padding: 12px 22px;

            border-radius: 7px;

            font-weight: 700;
        }


        .loading {

            text-align: center;

            background: white;

            padding: 50px;

            border-radius: 14px;

            color: #666;
        }


        .error {

            background: #ffe5e5;

            color: #c62828;

            padding: 18px;

            border-radius: 8px;

            text-align: center;
        }


        @media (max-width: 850px) {

            .details {

                grid-template-columns:
                    1fr 1fr;
            }

        }


        @media (max-width: 600px) {

            .booking-top {

                flex-direction: column;

                align-items: flex-start;

                gap: 12px;
            }


            .journey {

                grid-template-columns: 1fr;

            }


            .arrow {

                text-align: center;

                transform: rotate(90deg);
            }


            .details {

                grid-template-columns: 1fr;
            }


            .actions {

                flex-direction: column;
            }


            .btn {

                width: 100%;
            }
        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo">

        <span>IRCTC</span>

        <small>
            Railway Booking
        </small>

    </div>


    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="search-train.html">
            Search Train
        </a>

        <a href="my-bookings.html"
           class="active">

            My Bookings

        </a>

        <a href="profile.html">
            Profile
        </a>

        <a href="#"
           onclick="logout()">

            Logout

        </a>

    </nav>

</header>


<!-- ================= MAIN ================= -->

<main class="bookings-container">


    <section class="page-header">

        <h1>
            🎫 My Bookings
        </h1>

        <p>
            View and manage your railway bookings.
        </p>

    </section>


    <div id="bookingsContainer">

        <div class="loading">

            Loading your bookings...

        </div>

    </div>


</main>


<!-- ================= JAVASCRIPT ================= -->

<script>


    const userId =
        localStorage.getItem("userId");


    // =========================
    // LOGIN CHECK
    // =========================

    if (!userId) {

        window.location.href =
            "login.html";
    }


    // =========================
    // LOAD BOOKINGS
    // =========================

    async function loadBookings() {

        const container =
            document.getElementById(
                "bookingsContainer"
            );


        try {

            const response =
                await fetch(
                    `/api/bookings/user/${userId}`
                );


            if (!response.ok) {

                const error =
                    await response.text();

                throw new Error(
                    error ||
                    "Unable to load bookings"
                );
            }


            const bookings =
                await response.json();


            if (!bookings ||
                bookings.length === 0) {

                showEmpty();

                return;
            }


            container.innerHTML = "";


            bookings.forEach(
                booking => {

                    container.appendChild(
                        createBookingCard(
                            booking
                        )
                    );

                }
            );


        } catch (error) {

            console.error(error);

            container.innerHTML = `

            <div class="error">

                Unable to load bookings.

                <br><br>

                ${escapeHtml(
                error.message
            )}

                <br><br>

                <button
                    class="btn view-btn"
                    onclick="loadBookings()">

                    Try Again

                </button>

            </div>

        `;
        }
    }


    // =========================
    // CREATE BOOKING CARD
    // =========================

    function createBookingCard(
        booking
    ) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "booking-card";


        const status =
            booking.bookingStatus ||
            "PENDING";


        let statusClass =
            "pending";


        if (
            status.toUpperCase() ===
            "CONFIRMED"
        ) {

            statusClass =
                "confirmed";
        }


        if (
            status.toUpperCase() ===
            "CANCELLED"
        ) {

            statusClass =
                "cancelled";
        }


        const train =
            booking.train || {};


        const trainNumber =
            train.trainNumber || "-";


        const trainName =
            train.trainName || "Train";


        const journeyDate =
            booking.journeyDate || "-";


        const from =
            booking.fromStation ||
            train.source ||
            "-";


        const to =
            booking.toStation ||
            train.destination ||
            "-";


        const classType =
            booking.classType || "-";


        const fare =
            booking.totalFare != null
                ? booking.totalFare
                : 0;


        card.innerHTML = `

        <div class="booking-top">

            <div>

                <div class="pnr">

                    PNR:
                    ${escapeHtml(
            booking.pnr ||
            "Pending"
        )}

                </div>

                <small>

                    ${escapeHtml(
            trainNumber
        )}

                    -

                    ${escapeHtml(
            trainName
        )}

                </small>

            </div>


            <span
                class="status ${statusClass}">

                ${escapeHtml(status)}

            </span>

        </div>


        <div class="journey">

            <div class="station">

                <span>
                    From
                </span>

                <strong>
                    ${escapeHtml(from)}
                </strong>

            </div>


            <div class="arrow">
                →
            </div>


            <div class="station">

                <span>
                    To
                </span>

                <strong>
                    ${escapeHtml(to)}
                </strong>

            </div>

        </div>


        <div class="details">


            <div class="detail-box">

                <span>
                    Journey Date
                </span>

                <strong>
                    ${escapeHtml(
            journeyDate
        )}
                </strong>

            </div>


            <div class="detail-box">

                <span>
                    Class
                </span>

                <strong>
                    ${escapeHtml(
            classType
        )}
                </strong>

            </div>


            <div class="detail-box">

                <span>
                    Total Fare
                </span>

                <strong>
                    ₹${escapeHtml(
            String(fare)
        )}
                </strong>

            </div>


            <div class="detail-box">

                <span>
                    Booking Time
                </span>

                <strong>
                    ${formatDateTime(
            booking.bookingTime
        )}
                </strong>

            </div>


        </div>


        <div class="actions">


            <button
                class="btn view-btn"
                onclick="viewTicket(
                    ${booking.id}
                )">

                View Ticket

            </button>


            ${
            status.toUpperCase() !==
            "CANCELLED"

                ? `

                <button
                    class="btn cancel-btn"
                    onclick="cancelBooking(
                        ${booking.id}
                    )">

                    Cancel Ticket

                </button>

                `

                : ""
        }


        </div>

    `;


        return card;
    }


    // =========================
    // VIEW TICKET
    // =========================

    async function viewTicket(
        bookingId
    ) {

        try {

            const response =
                await fetch(
                    `/api/bookings/${bookingId}`
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load ticket"
                );
            }


            const booking =
                await response.json();


            localStorage.setItem(
                "selectedBooking",
                JSON.stringify(booking)
            );


            window.location.href =
                "ticket.html";


        } catch (error) {

            alert(
                error.message
            );
        }
    }


    // =========================
    // CANCEL BOOKING
    // =========================

    async function cancelBooking(
        bookingId
    ) {

        const confirmCancel =
            confirm(
                "Are you sure you want to cancel this ticket?"
            );


        if (!confirmCancel) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/bookings/${bookingId}/cancel`,
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                const error =
                    await response.text();

                throw new Error(
                    error ||
                    "Cancellation failed"
                );
            }


            alert(
                "Ticket cancelled successfully."
            );


            loadBookings();


        } catch (error) {

            console.error(error);

            alert(
                "Cancellation failed: " +
                error.message
            );
        }
    }


    // =========================
    // EMPTY BOOKINGS
    // =========================

    function showEmpty() {

        const container =
            document.getElementById(
                "bookingsContainer"
            );


        container.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🎫
            </div>

            <h2>
                No Bookings Found
            </h2>

            <p>
                You haven't booked any train tickets yet.
            </p>

            <a
                href="search-train.html"
                class="search-btn">

                Search Train

            </a>

        </div>

    `;
    }


    // =========================
    // FORMAT DATE
    // =========================

    function formatDateTime(
        value
    ) {

        if (!value) {
            return "-";
        }


        try {

            return new Date(value)
                .toLocaleString();

        } catch {

            return value;
        }
    }


    // =========================
    // HTML SECURITY
    // =========================

    function escapeHtml(
        value
    ) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    // =========================
    // LOGOUT
    // =========================

    function logout() {

        localStorage.clear();

        window.location.href =
            "index.html";
    }


    // =========================
    // INITIAL LOAD
    // =========================

    loadBookings();

</script>

</body>

</html>
