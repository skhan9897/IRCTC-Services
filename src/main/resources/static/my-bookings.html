<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | IRCTC Next Gen Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --irctc-blue: #213d77;
            --irctc-orange: #fb792b;
            --bg-light: #f0f2f5;
            --white: #ffffff;
            --text-dark: #333;
            --text-muted: #777;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles (Consistent across pages) */
        .sidebar {
            width: 260px;
            background: var(--irctc-blue);
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }
        .sidebar-brand { padding: 0 25px 30px; display: flex; align-items: center; gap: 12px; }
        .sidebar-brand i { font-size: 28px; }
        .sidebar-brand span { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; flex: 1; }
        .sidebar-menu li a {
            padding: 14px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: var(--transition);
            border-left: 4px solid transparent;
        }
        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-left-color: var(--irctc-orange);
        }
        .logout-area { padding: 20px 25px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .logout-btn-side { display: flex; align-items: center; gap: 12px; color: #ff8a8a; text-decoration: none; }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .booking-ticket {
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            overflow: hidden;
            display: flex;
            border-left: 8px solid var(--irctc-blue);
        }

        .ticket-left {
            flex: 1;
            padding: 25px;
        }

        .ticket-right {
            width: 200px;
            background: #f8f9fa;
            border-left: 1px dashed #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .pnr-box {
            background: var(--irctc-blue);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 10px;
        }

        .journey-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
        }

        .station h4 { margin: 0; font-size: 20px; }
        .station p { margin: 0; color: var(--text-muted); font-size: 14px; }

        .status-badge {
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .confirmed { background: rgba(46, 204, 113, 0.1); color: #2ecc71; }
        .cancelled { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }

        .print-btn {
            background: var(--white);
            border: 1px solid var(--irctc-blue);
            color: var(--irctc-blue);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            margin-top: 15px;
            width: 100%;
        }

        .cancel-btn {
            background: transparent;
            color: #e74c3c;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
        }

        @media (max-width: 992px) {
            .sidebar { width: 80px; }
            .sidebar-brand span, .sidebar-menu li a span { display: none; }
            .main-content { margin-left: 80px; }
        }

        @media (max-width: 768px) {
            .booking-ticket { flex-direction: column; }
            .ticket-right { width: 100%; border-left: none; border-top: 1px dashed #ddd; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand"><i class="fas fa-subway"></i><span>IRCTC</span></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
            <li><a href="search-train.html"><i class="fas fa-search"></i><span>Search Train</span></a></li>
            <li><a href="my-bookings.html" class="active"><i class="fas fa-ticket-alt"></i><span>My Bookings</span></a></li>
            <li><a href="profile.html"><i class="fas fa-user-circle"></i><span>My Profile</span></a></li>
            <li><a href="payment.html"><i class="fas fa-credit-card"></i><span>Payments</span></a></li>
        </ul>
        <div class="logout-area"><a href="#" class="logout-btn-side" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h2><i class="fas fa-history" style="color:var(--irctc-orange)"></i> My Journey History</h2>
            <p style="color:var(--text-muted)">View and manage all your past and upcoming train bookings.</p>
        </div>

        <div id="bookingsList">
            <div style="text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin fa-3x"></i>
                <p>Loading your tickets...</p>
            </div>
        </div>
    </main>

    <script>
        const userId = localStorage.getItem("userId");
        if (!userId) window.location.href = "login.html";

        async function loadBookings() {
            const listDiv = document.getElementById("bookingsList");
            try {
                const res = await fetch(`/api/bookings/user/${userId}`);
                const bookings = await res.json();

                if (bookings.length === 0) {
                    listDiv.innerHTML = '<div style="text-align:center; background:white; padding:50px; border-radius:15px"><h3>No bookings found</h3><p>You haven\'t booked any tickets yet.</p></div>';
                    return;
                }

                listDiv.innerHTML = "";
                bookings.reverse().forEach(b => {
                    const card = document.createElement("div");
                    card.className = "booking-ticket";
                    const statusClass = b.bookingStatus.toLowerCase();

                    card.innerHTML = `
                        <div class="ticket-left">
                            <div class="pnr-box">PNR: ${b.pnr || 'N/A'}</div>
                            <span class="status-badge ${statusClass}" style="float:right">${b.bookingStatus}</span>

                            <div class="journey-info">
                                <div class="station">
                                    <h4>${b.fromStation}</h4>
                                    <p>Departure</p>
                                </div>
                                <i class="fas fa-long-arrow-alt-right" style="color:#ccc"></i>
                                <div class="station">
                                    <h4>${b.toStation}</h4>
                                    <p>Destination</p>
                                </div>
                            </div>

                            <div style="display:flex; gap:30px; font-size:14px; margin-top:15px">
                                <div><i class="far fa-calendar-alt"></i> ${b.journeyDate}</div>
                                <div><i class="fas fa-couch"></i> ${b.classType}</div>
                                <div><i class="fas fa-train"></i> Train: ${b.train ? b.train.trainNumber : 'Express'}</div>
                            </div>
                        </div>
                        <div class="ticket-right">
                            <div style="font-size:24px; font-weight:700">₹${b.totalFare}</div>
                            <button class="print-btn" onclick="alert('Printing...')"><i class="fas fa-print"></i> E-Ticket</button>
                            ${b.bookingStatus !== 'CANCELLED' ? `<button class="cancel-btn" onclick="cancelBooking(${b.id})">Cancel Ticket</button>` : ''}
                        </div>
                    `;
                    listDiv.appendChild(card);
                });
            } catch (e) {
                listDiv.innerHTML = '<h3>Error loading bookings.</h3>';
            }
        }

        async function cancelBooking(id) {
            if (confirm("Are you sure you want to cancel this ticket?")) {
                try {
                    const res = await fetch(`/api/bookings/${id}/cancel`, { method: 'POST' });
                    if (res.ok) {
                        alert("Ticket cancelled successfully.");
                        loadBookings();
                    }
                } catch (e) { alert("Failed to cancel."); }
            }
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        loadBookings();
    </script>
</body>
</html>
