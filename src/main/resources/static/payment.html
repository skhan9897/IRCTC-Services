<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway | IRCTC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .payment-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .amount { font-size: 32px; font-weight: 800; color: #213d77; margin: 20px 0; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { font-size: 12px; font-weight: 600; color: #777; display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .pay-btn { width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="payment-card">
        <h3>Secure Payment</h3>
        <div class="amount" id="amtDisplay">₹0</div>
        <div class="input-group"><label>Card Number</label><input type="text" placeholder="XXXX XXXX XXXX XXXX"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px">
            <div class="input-group"><label>Expiry</label><input type="text" placeholder="MM/YY"></div>
            <div class="input-group"><label>CVV</label><input type="password" placeholder="***"></div>
        </div>
        <button class="pay-btn" onclick="confirmPayment()">Pay & Book Ticket</button>
    </div>

    <script>
        const booking = JSON.parse(localStorage.getItem("lastBooking"));
        if(!booking) window.location.href="dashboard.html";
        document.getElementById("amtDisplay").textContent = `₹${booking.totalFare}`;

        async function confirmPayment() {
            // Mock payment success
            const data = {
                bookingId: booking.id,
                amount: booking.totalFare,
                paymentMode: "CARD",
                transactionId: "TXN" + Math.floor(Math.random()*1000000)
            };

            try {
                const res = await fetch('/api/payments', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                alert("Payment Successful! Redirecting to ticket...");
                window.location.href = "ticket.html";
            } catch (e) { alert("Payment error"); }
        }
    </script>
</body>
</html>
