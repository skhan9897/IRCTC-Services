<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - IRCTC</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #f4f7fb;
    }
    .payment-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .page-title {
      text-align: center;
      margin-bottom: 25px;
    }
    .page-title h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .page-title p {
      color: #666;
    }
    .payment-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 25px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }
    .card h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }
    .summary-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }
    .info-box {
      background: #f5f7fa;
      padding: 15px;
      border-radius: 8px;
    }
    .info-box span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-bottom: 5px;
    }
    .info-box strong {
      font-size: 16px;
    }
    .payment-options {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }
    .payment-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid #d5d9df;
      border-radius: 8px;
      background: #fff;
    }
    .payment-option input {
      accent-color: #315b9b;
    }
    .payment-details {
      display: none;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #eee;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 7px;
    }
    .form-group input, .form-group select {
      width: 100%;
      height: 44px;
      border: 1px solid #d5d9df;
      border-radius: 7px;
      padding: 0 12px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .payment-message {
      display: none;
      padding: 12px;
      margin-top: 14px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }
    .payment-message.success {
      display: block;
      background: #e3f6e8;
      color: #187a35;
    }
    .payment-message.error {
      display: block;
      background: #ffe5e5;
      color: #c62828;
    }
    .pay-btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 8px;
      background: #315b9b;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .pay-btn:hover { opacity: 0.95; }
    .amount-box {
      background: #f5f7fa;
      padding: 18px;
      border-radius: 8px;
      margin-top: 18px;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
    }
    @media (max-width: 800px) {
      .payment-grid { grid-template-columns: 1fr; }
      .summary-box { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <span>IRCTC</span>
      <small>Railway Booking</small>
    </div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="search-train.html">Search Train</a>
      <a href="my-bookings.html">My Bookings</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <main class="payment-container">
    <div class="page-title">
      <h1>💳 Payment</h1>
      <p>Complete secure payment for your ticket.</p>
    </div>

    <div class="payment-grid">
      <div class="card">
        <h2>🚆 Ticket Summary</h2>
        <div class="summary-box">
          <div class="info-box"><span>PNR</span><strong id="pnr">-</strong></div>
          <div class="info-box"><span>Train</span><strong id="trainName">-</strong></div>
          <div class="info-box"><span>Number</span><strong id="trainNumber">-</strong></div>
          <div class="info-box"><span>Class</span><strong id="classType">-</strong></div>
          <div class="info-box"><span>From</span><strong id="fromStation">-</strong></div>
          <div class="info-box"><span>To</span><strong id="toStation">-</strong></div>
          <div class="info-box"><span>Journey Date</span><strong id="journeyDate">-</strong></div>
          <div class="info-box"><span>Passengers</span><strong id="passengerCount">0</strong></div>
        </div>
        <div class="amount-box">
          <span>Total Amount</span>
          <span>₹<span id="totalFare">0</span></span>
        </div>
      </div>

      <div class="card">
        <h2>Payment Method</h2>
        <form id="paymentForm">
          <div class="payment-options">
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="UPI">
              <span>UPI</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="CARD">
              <span>Debit/Credit Card</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="NET_BANKING">
              <span>Net Banking</span>
            </label>
          </div>

          <div id="UPIDetails" class="payment-details">
            <div class="form-group">
              <label for="upiId">UPI ID</label>
              <input id="upiId" type="text" placeholder="yourname@upi">
            </div>
          </div>

          <div id="CARDDetails" class="payment-details">
            <div class="form-group">
              <label for="cardNumber">Card Number</label>
              <input id="cardNumber" type="text" maxlength="19" placeholder="1234 5678 9012 3456">
            </div>
            <div class="form-group">
              <label for="cardName">Cardholder Name</label>
              <input id="cardName" type="text" placeholder="Name on card">
            </div>
            <div class="form-group">
              <label for="expiry">Expiry (MM/YY)</label>
              <input id="expiry" type="text" maxlength="5" placeholder="12/29">
            </div>
            <div class="form-group">
              <label for="cvv">CVV</label>
              <input id="cvv" type="password" maxlength="4" placeholder="123">
            </div>
          </div>

          <div id="NET_BANKINGDetails" class="payment-details">
            <div class="form-group">
              <label for="bank">Select Bank</label>
              <select id="bank">
                <option value="">Select bank</option>
                <option value="SBI">State Bank of India</option>
                <option value="HDFC">HDFC Bank</option>
                <option value="ICICI">ICICI Bank</option>
                <option value="AXIS">Axis Bank</option>
                <option value="PNB">PNB</option>
              </select>
            </div>
          </div>

          <div id="paymentMessage" class="payment-message"></div>
          <button type="submit" id="payButton" class="pay-btn">Pay Now</button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/payment.js"></script>
</body>
</html>
