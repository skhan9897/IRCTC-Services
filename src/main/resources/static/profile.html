<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | IRCTC Next Gen Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --irctc-blue: #213d77;
            --irctc-orange: #fb792b;
            --bg-light: #f0f2f5;
            --white: #ffffff;
            --text-dark: #333;
            --text-muted: #777;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar { width: 260px; background: var(--irctc-blue); color: white; padding: 20px 0; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
        .sidebar-brand { padding: 0 25px 30px; display: flex; align-items: center; gap: 12px; }
        .sidebar-brand i { font-size: 28px; }
        .sidebar-brand span { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; flex: 1; }
        .sidebar-menu li a {
            padding: 14px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: var(--transition);
            border-left: 4px solid transparent;
        }
        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-left-color: var(--irctc-orange);
        }
        .logout-area { padding: 20px 25px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .logout-btn-side { display: flex; align-items: center; gap: 12px; color: #ff8a8a; text-decoration: none; }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .profile-container {
            width: 100%;
            max-width: 800px;
        }

        .profile-card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .profile-header {
            background: linear-gradient(135deg, var(--irctc-blue), #3a5ba0);
            height: 150px;
            position: relative;
        }

        .profile-avatar-big {
            width: 120px;
            height: 120px;
            background: var(--white);
            border: 5px solid var(--white);
            border-radius: 50%;
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: var(--irctc-blue);
            box-shadow: var(--shadow);
        }

        .profile-body {
            padding: 80px 40px 40px;
            text-align: center;
        }

        .profile-body h2 { margin: 0; font-size: 26px; }
        .profile-body p { color: var(--text-muted); margin-bottom: 30px; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            text-align: left;
        }

        .info-item {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 12px;
        }

        .info-item label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .info-item span {
            font-weight: 500;
            font-size: 16px;
        }

        .edit-btn {
            background: var(--irctc-orange);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: var(--transition);
        }

        .edit-btn:hover { background: #e66a22; transform: translateY(-2px); }

        @media (max-width: 992px) {
            .sidebar { width: 80px; }
            .sidebar-brand span, .sidebar-menu li a span { display: none; }
            .main-content { margin-left: 80px; }
        }

        @media (max-width: 600px) {
            .info-grid { grid-template-columns: 1fr; }
            .profile-body { padding: 80px 20px 40px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand"><i class="fas fa-subway"></i><span>IRCTC</span></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
            <li><a href="search-train.html"><i class="fas fa-search"></i><span>Search Train</span></a></li>
            <li><a href="my-bookings.html"><i class="fas fa-ticket-alt"></i><span>My Bookings</span></a></li>
            <li><a href="profile.html" class="active"><i class="fas fa-user-circle"></i><span>My Profile</span></a></li>
            <li><a href="payment.html"><i class="fas fa-credit-card"></i><span>Payments</span></a></li>
        </ul>
        <div class="logout-area"><a href="#" class="logout-btn-side" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></div>
    </aside>

    <main class="main-content">
        <div class="profile-container">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-avatar-big" id="initials">U</div>
                </div>
                <div class="profile-body">
                    <h2 id="fullName">Loading...</h2>
                    <p id="role">Passenger</p>

                    <div class="info-grid">
                        <div class="info-item">
                            <label>Full Name</label>
                            <span id="dispName">-</span>
                        </div>
                        <div class="info-item">
                            <label>Email Address</label>
                            <span id="dispEmail">-</span>
                        </div>
                        <div class="info-item">
                            <label>Mobile Number</label>
                            <span id="dispMobile">-</span>
                        </div>
                        <div class="info-item">
                            <label>Member Since</label>
                            <span id="dispJoined">January 2024</span>
                        </div>
                    </div>

                    <button class="edit-btn" onclick="alert('Feature coming soon!')">Edit Profile</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const userId = localStorage.getItem("userId");
        if (!userId) window.location.href = "login.html";

        async function loadProfile() {
            try {
                const res = await fetch(`/api/users/${userId}`);
                const user = await res.json();

                document.getElementById("fullName").textContent = user.name;
                document.getElementById("dispName").textContent = user.name;
                document.getElementById("dispEmail").textContent = user.email;
                document.getElementById("dispMobile").textContent = user.mobile || 'Not provided';
                document.getElementById("initials").textContent = user.name[0].toUpperCase();

            } catch (e) { console.error(e); }
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        loadProfile();
    </script>
</body>
</html>
