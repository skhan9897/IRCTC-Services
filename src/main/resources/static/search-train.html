<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Train | IRCTC Next Gen Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --irctc-blue: #213d77;
            --irctc-orange: #fb792b;
            --bg-light: #f0f2f5;
            --white: #ffffff;
            --text-dark: #333;
            --text-muted: #777;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles (Copy from dashboard) */
        .sidebar {
            width: 260px;
            background: var(--irctc-blue);
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-brand { padding: 0 25px 30px; display: flex; align-items: center; gap: 12px; }
        .sidebar-brand i { font-size: 28px; color: var(--white); }
        .sidebar-brand span { font-size: 22px; font-weight: 700; letter-spacing: 1px; }

        .sidebar-menu { list-style: none; padding: 0; margin: 0; flex: 1; }
        .sidebar-menu li a {
            padding: 14px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: var(--transition);
            border-left: 4px solid transparent;
        }

        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-left-color: var(--irctc-orange);
        }

        .logout-area { padding: 20px 25px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .logout-btn-side { display: flex; align-items: center; gap: 12px; color: #ff8a8a; text-decoration: none; font-weight: 500; }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
        }

        /* Search Header */
        .search-box {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-items: end;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text-muted); }

        .input-with-icon { position: relative; }
        .input-with-icon i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--irctc-blue); }
        .input-with-icon input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
        }
        .station-field {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .station-field .input-with-icon {
            flex: 1;
        }
        .station-dropdown-btn {
            background: var(--irctc-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 14px;
            font-weight: 600;
            cursor: pointer;
            min-width: 92px;
            height: 46px;
        }

        /* Autocomplete styles */
        .autocomplete-items {
            position: absolute;
            border: 1px solid #d4d4d4;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #fff;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: left;
        }
        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #d4d4d4;
            color: var(--text-dark);
        }
        .autocomplete-items div:hover {
            background-color: #e9e9e9;
        }
        .autocomplete-active {
            background-color: var(--irctc-blue) !important;
            color: #ffffff !important;
        }

        .search-btn {
            background: var(--irctc-orange);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            height: 46px;
        }

        /* Train Results */
        .train-card {
            background: var(--white);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border-left: 5px solid var(--irctc-blue);
        }

        .train-card:hover {
            transform: scale(1.01);
        }

        .train-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .train-name-num h3 { margin: 0; font-size: 20px; color: var(--irctc-blue); }
        .train-name-num p { margin: 5px 0 0; color: var(--text-muted); font-size: 14px; }

        .route-display {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 40px;
            align-items: center;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .station-box h4 { margin: 0; font-size: 18px; }
        .station-box p { margin: 5px 0 0; color: var(--text-muted); font-size: 14px; }

        .time-arrow { text-align: center; color: var(--irctc-blue); }
        .time-arrow i { font-size: 20px; }

        .availability-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .class-btn {
            flex: 1;
            min-width: 120px;
            background: var(--white);
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .class-btn:hover {
            border-color: var(--irctc-orange);
            background: rgba(251, 121, 43, 0.05);
        }

        .class-btn.selected {
            border-color: var(--irctc-orange);
            background: rgba(251, 121, 43, 0.1);
        }

        .class-btn strong { display: block; font-size: 16px; margin-bottom: 5px; }
        .class-btn span { display: block; color: var(--irctc-orange); font-weight: 600; }
        .class-btn small { display: block; color: var(--text-muted); margin-top: 5px; }

        .no-trains {
            text-align: center;
            padding: 60px;
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        @media (max-width: 992px) {
            .sidebar { width: 80px; }
            .sidebar-brand span, .sidebar-menu li a span { display: none; }
            .main-content { margin-left: 80px; }
        }

        @media (max-width: 768px) {
            .route-display { grid-template-columns: 1fr; gap: 20px; text-align: center; }
            .time-arrow i { transform: rotate(90deg); }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-subway"></i>
            <span>IRCTC</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
            <li><a href="search-train.html" class="active"><i class="fas fa-search"></i> <span>Search Train</span></a></li>
            <li><a href="my-bookings.html"><i class="fas fa-ticket-alt"></i> <span>My Bookings</span></a></li>
            <li><a href="profile.html"><i class="fas fa-user-circle"></i> <span>My Profile</span></a></li>
            <li><a href="payment.html"><i class="fas fa-credit-card"></i> <span>Payments</span></a></li>
        </ul>
        <div class="logout-area">
            <a href="#" class="logout-btn-side" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
        </div>
    </aside>

    <main class="main-content">
        <div class="search-box">
            <h2 style="margin-top:0"><i class="fas fa-train" style="color:var(--irctc-blue)"></i> Search Your Journey</h2>
            <div class="search-grid">
                <div class="form-group">
                    <label>FROM STATION</label>
                    <div class="station-field">
                        <div class="input-with-icon" style="flex:1;">
                            <i class="fas fa-map-marker-alt"></i>
                            <input type="text" id="from" placeholder="Search city / station / junction" autocomplete="off">
                        </div>
                        <button type="button" class="station-dropdown-btn" data-target="from">Search</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>TO STATION</label>
                    <div class="station-field">
                        <div class="input-with-icon" style="flex:1;">
                            <i class="fas fa-location-arrow"></i>
                            <input type="text" id="to" placeholder="Search city / station / junction" autocomplete="off">
                        </div>
                        <button type="button" class="station-dropdown-btn" data-target="to">Search</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>JOURNEY DATE</label>
                    <div class="input-with-icon">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="date" id="journeyDate">
                    </div>
                </div>
                <button class="search-btn" onclick="searchTrains()">SEARCH TRAINS</button>
            </div>
        </div>

        <div id="resultsList">
            <!-- Results will appear here -->
            <div class="no-trains">
                <i class="fas fa-search fa-3x" style="color:#ddd; margin-bottom:20px"></i>
                <h3>Start Searching</h3>
                <p style="color:var(--text-muted)">Enter details above to find available trains for your route.</p>
            </div>
        </div>
    </main>

    <script>
        // Load initial search if available
        document.getElementById("from").value = localStorage.getItem("from") || "";
        document.getElementById("to").value = localStorage.getItem("to") || "";
        document.getElementById("journeyDate").value = localStorage.getItem("journeyDate") || "";

        const todayStr = new Date().toISOString().split("T")[0];
        document.getElementById("journeyDate").setAttribute("min", todayStr);

        let stationList = [];

        function buildStationSuggestions(data) {
            const items = [];
            data.forEach(s => {
                const label = `${s.stationName} ${s.stationCode ? '('+s.stationCode+')' : ''} ${s.city || ''} ${s.state || ''}`.trim();
                if (label && !items.includes(label)) items.push(label);
            });
            return items;
        }

        async function fetchStations() {
            try {
                const [stationsRes, trainsRes] = await Promise.all([
                    fetch('/api/stations'),
                    fetch('/api/trains')
                ]);

                const stationData = stationsRes.ok ? await stationsRes.json() : [];
                const trainData = trainsRes.ok ? await trainsRes.json() : [];

                const combined = [
                    ...stationData,
                    ...trainData.map(train => ({
                        stationName: train.source,
                        stationCode: train.sourceCode || '',
                        city: train.source,
                        state: train.sourceState || ''
                    })),
                    ...trainData.map(train => ({
                        stationName: train.destination,
                        stationCode: train.destinationCode || '',
                        city: train.destination,
                        state: train.destinationState || ''
                    }))
                ];

                stationList = buildStationSuggestions(combined);
            } catch (error) {
                console.error("Error fetching stations:", error);
                stationList = [
                    "NEW DELHI (NDLS)",
                    "MUMBAI CENTRAL (MMCT)",
                    "BAREILLY (BE)",
                    "LUCKNOW (LKO)",
                    "KANPUR CENTRAL (CNB)",
                    "ALLAHABAD (PRYJ)",
                    "VARANASI JN (BSB)",
                    "NAGPUR (NGP)"
                ];
            }

            autocomplete(document.getElementById("from"), stationList);
            autocomplete(document.getElementById("to"), stationList);
            document.querySelectorAll('.station-dropdown-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const input = document.getElementById(button.dataset.target);
                    if (input) {
                        showSuggestions(input, stationList);
                        input.focus();
                    }
                });
            });
        }

        function closeAllStationLists(activeInput) {
            const allLists = document.getElementsByClassName('autocomplete-items');
            Array.from(allLists).forEach((list) => {
                if (list && list.id !== (activeInput ? activeInput.id + 'autocomplete-list' : '')) {
                    list.remove();
                }
            });
        }

        function showSuggestions(inp, arr) {
            closeAllStationLists(inp);
            const filtered = arr.filter(option => option.toUpperCase().includes((inp.value || '').toUpperCase()));
            const toShow = filtered.length > 0 ? filtered : arr.slice(0, 12);

            if (!toShow.length) return false;
            const list = document.createElement('DIV');
            list.setAttribute('id', inp.id + 'autocomplete-list');
            list.setAttribute('class', 'autocomplete-items');
            inp.parentNode.parentNode.appendChild(list);
            toShow.forEach((value) => {
                const item = document.createElement('DIV');
                item.innerHTML = value;
                item.innerHTML += "<input type='hidden' value='" + value + "'>";
                item.addEventListener('click', function() {
                    inp.value = this.getElementsByTagName('input')[0].value;
                    closeAllStationLists(inp);
                });
                list.appendChild(item);
            });
            return true;
        }

        function autocomplete(inp, arr) {
            let currentFocus;
            inp.addEventListener("focus", function() {
                showSuggestions(this, arr);
            });
            inp.addEventListener("input", function(e) {
                showSuggestions(this, arr);
            });
            inp.addEventListener("keydown", function(e) {
                let x = document.getElementById(this.id + "autocomplete-list");
                if (x) x = x.getElementsByTagName("div");
                if (e.keyCode == 40) {
                    currentFocus++;
                    addActive(x);
                } else if (e.keyCode == 38) {
                    currentFocus--;
                    addActive(x);
                } else if (e.keyCode == 13) {
                    e.preventDefault();
                    if (currentFocus > -1) {
                        if (x) x[currentFocus].click();
                    }
                }
            });
            function addActive(x) {
                if (!x) return false;
                removeActive(x);
                if (currentFocus >= x.length) currentFocus = 0;
                if (currentFocus < 0) currentFocus = (x.length - 1);
                x[currentFocus].classList.add("autocomplete-active");
            }
            function removeActive(x) {
                for (let i = 0; i < x.length; i++) {
                    x[i].classList.remove("autocomplete-active");
                }
            }
            document.addEventListener("click", function (e) {
                if (!e.target.closest('.station-dropdown-btn') && !e.target.closest('#' + inp.id) && !e.target.closest('.autocomplete-items')) {
                    closeAllStationLists(inp);
                }
            });
        }

        fetchStations();

        let currentResults = [];

        async function searchTrains() {
            const from = document.getElementById("from").value;
            const to = document.getElementById("to").value;
            const date = document.getElementById("journeyDate").value;

            if(!from || !to || !date) {
                alert("Please fill all fields");
                return;
            }

            localStorage.setItem("from", from);
            localStorage.setItem("to", to);
            localStorage.setItem("journeyDate", date);

            const resultsDiv = document.getElementById("resultsList");
            resultsDiv.innerHTML = '<div class="no-trains"><i class="fas fa-spinner fa-spin fa-2x"></i><br><p>Searching for best trains...</p></div>';

            try {
                // Using the specific date search via TrainSchedule
                const res = await fetch(`/api/schedules/search?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&date=${date}`);
                const schedules = await res.json();
                currentResults = schedules;
                displaySchedules(schedules);
            } catch (err) {
                resultsDiv.innerHTML = '<div class="no-trains"><h3>Error searching trains.</h3></div>';
            }
        }

        function displaySchedules(schedules) {
            const resultsDiv = document.getElementById("resultsList");
            if (schedules.length === 0) {
                resultsDiv.innerHTML = '<div class="no-trains"><h3>No trains found for this route on the selected date.</h3></div>';
                return;
            }

            resultsDiv.innerHTML = "";
            schedules.forEach((schedule, index) => {
                const train = schedule.train;
                const card = document.createElement("div");
                card.className = "train-card";

                card.innerHTML = `
                    <div class="train-info">
                        <div class="train-name-num">
                            <h3>${train.trainName}</h3>
                            <p>Train No: <span style="color:var(--irctc-orange); font-weight:700">${train.trainNumber}</span></p>
                        </div>
                        <div style="text-align:right">
                            <span style="color:var(--irctc-blue); font-weight:600">Date: ${schedule.journeyDate}</span>
                            <br>
                            <small style="color:${schedule.availableSeats > 0 ? '#2ecc71' : '#e74c3c'}; font-weight:600">
                                ${schedule.availableSeats} Seats Available
                            </small>
                        </div>
                    </div>

                    <div class="route-display">
                        <div class="station-box">
                            <h4>${schedule.departureTime || train.departureTime}</h4>
                            <p>${train.source}</p>
                        </div>
                        <div class="time-arrow">
                            <i class="fas fa-long-arrow-alt-right"></i>
                            <div style="font-size:12px">Express</div>
                        </div>
                        <div class="station-box" style="text-align:right">
                            <h4>${schedule.arrivalTime || train.arrivalTime}</h4>
                            <p>${train.destination}</p>
                        </div>
                    </div>

                    <div class="availability-grid">
                        ${renderClass('Sleeper', train.sleeperFare, 'SL', index)}
                        ${renderClass('AC 3 Tier', train.ac3Fare, 'AC3', index)}
                        ${renderClass('AC 2 Tier', train.ac2Fare, 'AC2', index)}
                        ${renderClass('AC 1 Tier', train.ac1Fare, 'AC1', index)}
                    </div>
                `;
                resultsDiv.appendChild(card);
            });
        }

        function renderClass(name, fare, code, resultIndex) {
            if (!fare) return '';
            return `
                <div class="class-btn" onclick="selectTrain(${resultIndex}, '${code}', ${fare})">
                    <strong>${code}</strong>
                    <span>₹${fare}</span>
                    <small>${name}</small>
                </div>
            `;
        }

        function selectTrain(index, code, fare) {
            const schedule = currentResults[index];
            const train = schedule.train;

            // Save full train object and schedule info for booking
            localStorage.setItem("selectedTrain", JSON.stringify(train));
            localStorage.setItem("selectedTrainId", train.id);
            localStorage.setItem("selectedScheduleId", schedule.id);
            localStorage.setItem("classType", code);
            localStorage.setItem("selectedFare", fare);
            localStorage.setItem("journeyDate", schedule.journeyDate);

            window.location.href = "booking.html";
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        if(localStorage.getItem("from")) searchTrains();
    </script>
</body>
</html>
