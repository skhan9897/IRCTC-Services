<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Train - IRCTC</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #f4f7fb;
        }

        .search-container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .search-header {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        .search-header h1 {
            margin-bottom: 8px;
        }

        .search-header p {
            color: #777;
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            margin-top: 20px;
            align-items: end;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            box-sizing: border-box;
            padding: 0 12px;
            border: 1px solid #d5d9df;
            border-radius: 7px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #315b9b;
        }

        .search-btn {
            height: 46px;
            padding: 0 25px;
            border: none;
            border-radius: 7px;
            background: #315b9b;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .result-title {
            margin: 25px 0 15px;
        }

        .train-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        .train-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 18px;
            margin-bottom: 20px;
        }

        .train-name {
            font-size: 20px;
            font-weight: 800;
        }

        .train-number {
            color: #777;
            margin-top: 5px;
        }

        .route {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }

        .station {
            background: #f6f8fb;
            padding: 18px;
            border-radius: 9px;
        }

        .station span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .station strong {
            font-size: 19px;
        }

        .route-arrow {
            font-size: 25px;
        }

        .train-details {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .detail {
            background: #f6f8fb;
            padding: 13px;
            border-radius: 8px;
        }

        .detail span {
            display: block;
            color: #777;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail strong {
            font-size: 14px;
        }

        .classes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .class-btn {
            min-width: 100px;
            padding: 12px;
            border: 1px solid #d5d9df;
            border-radius: 7px;
            background: white;
            cursor: pointer;
            text-align: center;
        }

        .class-btn:hover {
            border-color: #315b9b;
            background: #eef3fa;
        }

        .class-btn strong {
            display: block;
        }

        .class-btn small {
            color: #666;
        }

        .loading,
        .empty,
        .error {
            background: white;
            padding: 45px 20px;
            border-radius: 14px;
            text-align: center;
        }

        .error {
            color: #c62828;
            background: #ffe5e5;
        }

        @media (max-width: 900px) {
            .search-form {
                grid-template-columns: 1fr 1fr;
            }

            .train-details {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            .search-form {
                grid-template-columns: 1fr;
            }

            .train-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .route {
                grid-template-columns: 1fr;
            }

            .route-arrow {
                text-align: center;
                transform: rotate(90deg);
            }

            .train-details {
                grid-template-columns: 1fr;
            }

            .class-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>IRCTC</span>
        <small>Railway Booking</small>
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="search-train.html" class="active">Search Train</a>
        <a href="my-bookings.html">My Bookings</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>

</header>


<main class="search-container">

    <!-- SEARCH -->

    <section class="search-header">

        <h1>🚆 Search Trains</h1>

        <p>
            Find trains between your departure and destination stations.
        </p>

        <div class="search-form">

            <div class="form-group">

                <label>From Station</label>

                <input
                        type="text"
                        id="from"
                        placeholder="e.g. Bareilly">

            </div>

            <div class="form-group">

                <label>To Station</label>

                <input
                        type="text"
                        id="to"
                        placeholder="e.g. Delhi">

            </div>

            <div class="form-group">

                <label>Journey Date</label>

                <input
                        type="date"
                        id="journeyDate">

            </div>

            <button
                    class="search-btn"
                    onclick="searchTrains()">

                Search

            </button>

        </div>

    </section>


    <!-- RESULTS -->

    <h2 class="result-title">
        Available Trains
    </h2>

    <div id="results">

        <div class="empty">
            Enter From, To and Journey Date to search trains.
        </div>

    </div>

</main>


<script>

    /* =========================
       LOAD SAVED SEARCH
    ========================= */

    document.getElementById("from").value =
        localStorage.getItem("from") || "";

    document.getElementById("to").value =
        localStorage.getItem("to") || "";

    document.getElementById("journeyDate").value =
        localStorage.getItem("journeyDate") || "";


    /* =========================
       MIN DATE
    ========================= */

    const today =
        new Date()
            .toISOString()
            .split("T")[0];

    document
        .getElementById("journeyDate")
        .setAttribute("min", today);


    /* =========================
       SEARCH TRAINS
    ========================= */

    async function searchTrains() {

        const from =
            document
                .getElementById("from")
                .value
                .trim();

        const to =
            document
                .getElementById("to")
                .value
                .trim();

        const journeyDate =
            document
                .getElementById("journeyDate")
                .value;


        if (!from || !to || !journeyDate) {

            alert(
                "Please enter From, To and Journey Date."
            );

            return;
        }


        if (
            from.toLowerCase() ===
            to.toLowerCase()
        ) {

            alert(
                "From and To stations cannot be same."
            );

            return;
        }


        localStorage.setItem("from", from);
        localStorage.setItem("to", to);
        localStorage.setItem("journeyDate", journeyDate);


        const results =
            document.getElementById("results");


        results.innerHTML = `
        <div class="loading">
            Searching trains...
        </div>
    `;


        try {

            /*
             * Backend:
             *
             * GET /api/trains/search?from=...&to=...
             */

            const url =
                `/api/trains/search?from=${
                    encodeURIComponent(from)
                }&to=${
                    encodeURIComponent(to)
                }`;


            const response =
                await fetch(url);


            if (!response.ok) {

                const error =
                    await response.text();

                throw new Error(
                    error ||
                    "Unable to search trains."
                );
            }


            const trains =
                await response.json();


            displayTrains(trains);


        } catch (error) {

            console.error(error);

            results.innerHTML = `
            <div class="error">
                ${escapeHtml(error.message)}
                <br><br>
                Please try again.
            </div>
        `;
        }
    }


    /* =========================
       DISPLAY TRAINS
    ========================= */

    function displayTrains(trains) {

        const results =
            document.getElementById("results");


        if (!trains ||
            trains.length === 0) {

            results.innerHTML = `
            <div class="empty">

                <div style="font-size:50px;">
                    🚆
                </div>

                <h2>
                    No Trains Found
                </h2>

                <p>
                    No train is available for
                    this route.
                </p>

            </div>
        `;

            return;
        }


        results.innerHTML = "";


        trains.forEach(train => {

            const card =
                document.createElement("div");

            card.className =
                "train-card";


            card.innerHTML = `

            <div class="train-top">

                <div>

                    <div class="train-name">
                        ${escapeHtml(
                train.trainName || "Train"
            )}
                    </div>

                    <div class="train-number">
                        Train No:
                        ${escapeHtml(
                train.trainNumber || "-"
            )}
                    </div>

                </div>

            </div>


            <div class="route">

                <div class="station">

                    <span>
                        From
                    </span>

                    <strong>
                        ${escapeHtml(
                train.source || fromValue()
            )}
                    </strong>

                </div>


                <div class="route-arrow">
                    →
                </div>


                <div class="station">

                    <span>
                        To
                    </span>

                    <strong>
                        ${escapeHtml(
                train.destination || toValue()
            )}
                    </strong>

                </div>

            </div>


            <div class="train-details">

                <div class="detail">

                    <span>
                        Departure
                    </span>

                    <strong>
                        ${escapeHtml(
                train.departureTime || "-"
            )}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Arrival
                    </span>

                    <strong>
                        ${escapeHtml(
                train.arrivalTime || "-"
            )}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Total Seats
                    </span>

                    <strong>
                        ${train.totalSeats ?? "-"}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Available Seats
                    </span>

                    <strong>
                        ${train.availableSeats ?? "-"}
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Journey Date
                    </span>

                    <strong>
                        ${escapeHtml(
                journeyDateValue()
            )}
                    </strong>

                </div>

            </div>


            <div class="classes">

                ${createClassButton(
                "SL",
                train.sleeperFare
            )}

                ${createClassButton(
                "3A",
                train.ac3Fare
            )}

                ${createClassButton(
                "2A",
                train.ac2Fare
            )}

                ${createClassButton(
                "1A",
                train.ac1Fare
            )}

            </div>
        `;


            results.appendChild(card);

        });
    }


    /* =========================
       CLASS BUTTON
    ========================= */

    function createClassButton(
        classType,
        fare
    ) {

        if (
            fare === null ||
            fare === undefined
        ) {

            return "";
        }


        return `

        <button
            class="class-btn"
            onclick='selectTrain(
                ${JSON.stringify(
            classType
        )},
                ${JSON.stringify(
            fare
        )},
                this
            )'>

            <strong>
                ${classType}
            </strong>

            <small>
                ₹${fare}
            </small>

            <br>

            <small>
                Select
            </small>

        </button>

    `;
    }


    /* =========================
       SELECT TRAIN
    ========================= */

    function selectTrain(
        classType,
        fare,
        button
    ) {

        const card =
            button.closest(
                ".train-card"
            );


        /*
         * We need to find the selected
         * train from the result.
         */

        const trainName =
            card.querySelector(
                ".train-name"
            ).textContent.trim();


        const trainNumber =
            card.querySelector(
                ".train-number"
            ).textContent
                .replace("Train No:", "")
                .trim();


        const stations =
            card.querySelectorAll(
                ".station strong"
            );


        const source =
            stations[0]
                ? stations[0]
                    .textContent
                    .trim()
                : fromValue();


        const destination =
            stations[1]
                ? stations[1]
                    .textContent
                    .trim()
                : toValue();


        const detailValues =
            card.querySelectorAll(
                ".detail strong"
            );


        const departureTime =
            detailValues[0]
                ? detailValues[0]
                    .textContent
                    .trim()
                : "";


        const arrivalTime =
            detailValues[1]
                ? detailValues[1]
                    .textContent
                    .trim()
                : "";


        const totalSeats =
            detailValues[2]
                ? detailValues[2]
                    .textContent
                    .trim()
                : "";


        const availableSeats =
            detailValues[3]
                ? detailValues[3]
                    .textContent
                    .trim()
                : "";


        const selectedTrain = {

            /*
             * IMPORTANT:
             *
             * id is not available from
             * the rendered card.
             *
             * We search again from the API
             * before booking.
             */

            trainNumber:
            trainNumber,

            trainName:
            trainName,

            source:
            source,

            destination:
            destination,

            departureTime:
            departureTime,

            arrivalTime:
            arrivalTime,

            totalSeats:
                Number(totalSeats) || 0,

            availableSeats:
                Number(availableSeats) || 0,

            sleeperFare:
                classType === "SL"
                    ? fare
                    : 0,

            ac3Fare:
                classType === "3A"
                    ? fare
                    : 0,

            ac2Fare:
                classType === "2A"
                    ? fare
                    : 0,

            ac1Fare:
                classType === "1A"
                    ? fare
                    : 0
        };


        localStorage.setItem(
            "selectedTrain",
            JSON.stringify(
                selectedTrain
            )
        );


        localStorage.setItem(
            "classType",
            classType
        );


        localStorage.setItem(
            "selectedFare",
            fare
        );


        /*
         * Go to booking
         */

        alert(
            `${classType} selected. Continue to booking.`
        );


        window.location.href =
            "booking.html";
    }


    /* =========================
       HELPERS
    ========================= */

    function fromValue() {

        return document
            .getElementById("from")
            .value
            .trim();
    }


    function toValue() {

        return document
            .getElementById("to")
            .value
            .trim();
    }


    function journeyDateValue() {

        return document
            .getElementById("journeyDate")
            .value;
    }


    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

        localStorage.clear();

        window.location.href =
            "index.html";
    }


    /* =========================
       AUTO SEARCH
    ========================= */

    if (
        document.getElementById("from").value &&
        document.getElementById("to").value &&
        document.getElementById("journeyDate").value
    ) {

        searchTrains();

    }

</script>

</body>

</html>
