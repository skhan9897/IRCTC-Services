<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Trains | IRCTC Professional Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #002266;
            --sidebar-active: #1a73e8;
            --bg-color: #f0f5ff;
            --accent-orange: #fb792b;
            --text-dark: #1a1a1a;
            --text-muted: #64748b;
            --white: #ffffff;
            --border-light: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); display: flex; color: var(--text-dark); min-height: 100vh; }

        .sidebar { width: 260px; background: var(--sidebar-bg); height: 100vh; position: fixed; display: flex; flex-direction: column; color: white; z-index: 1000; }
        .sidebar-brand { padding: 30px 20px; display: flex; align-items: center; gap: 12px; }
        .sidebar-brand img { width: 42px; filter: brightness(0) invert(1); }
        .sidebar-brand h2 { font-size: 20px; font-weight: 800; line-height: 1; }
        .nav-list { list-style: none; flex: 1; padding-top: 10px; }
        .nav-list li a { display: flex; align-items: center; gap: 15px; padding: 14px 25px; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.3s; }
        .nav-list li a:hover, .nav-list li a.active { color: white; background: rgba(255,255,255,0.1); }
        .nav-list li a.active { border-left: 5px solid var(--sidebar-active); background: rgba(26, 115, 232, 0.15); }
        .nav-list li a i { width: 20px; font-size: 17px; }

        .main { margin-left: 260px; flex: 1; padding: 25px 40px; }

        .search-box { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 30px; }
        .search-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; align-items: end; }
        .form-group { display: flex; flex-direction: column; gap: 8px; position: relative; }
        .form-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .form-group input { width: 100%; padding: 12px 15px 12px 40px; border: 1px solid var(--border-light); border-radius: 10px; font-size: 14px; font-family: inherit; }
        .form-group i { position: absolute; left: 15px; top: 38px; color: var(--sidebar-active); }
        .btn-search { background: var(--accent-orange); color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 700; cursor: pointer; height: 46px; transition: 0.3s; }

        .train-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); transition: 0.3s; border-left: 5px solid transparent; }
        .train-card:hover { border-left-color: var(--sidebar-active); transform: translateX(5px); }
        .train-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .train-name h3 { font-size: 18px; font-weight: 800; color: #1e293b; }
        .train-name p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .train-fare { text-align: right; }
        .train-fare h4 { font-size: 20px; font-weight: 800; color: var(--accent-orange); }

        .route-visual { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .time-box h4 { font-size: 22px; font-weight: 900; color: #1e293b; }
        .route-path { flex: 1; text-align: center; color: #cbd5e1; }

        .class-options { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px;}
        .class-btn { flex: 1; min-width: 120px; border: 1px solid var(--border-light); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
        .class-btn:hover, .class-btn.selected { border-color: var(--sidebar-active); background: #f0f7ff; }
        .class-btn strong { display: block; font-size: 15px; color: #1e293b; }
        .class-btn span { font-size: 12px; color: #10b981; font-weight: 700; margin-top: 5px; display: block; }
        .class-btn p { font-size: 10px; color: var(--text-muted); margin-top: 5px; }

        .btn-continue { width: 100%; background: var(--sidebar-active); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: 700; cursor: pointer; display: none; }

        .no-results { text-align: center; padding: 60px; color: var(--text-muted); }

        .autocomplete-items { position: absolute; border: 1px solid #d4d4d4; border-bottom: none; border-top: none; z-index: 99; top: 100%; left: 0; right: 0; background: #fff; border-radius: 0 0 10px 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto; }
        .autocomplete-items div { padding: 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 13px; color: #333; }
        .autocomplete-items div:hover { background-color: #f8fafc; color: var(--sidebar-active); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="https://storage.googleapis.com/app-inventor-releases/4849a6224859424e861e40eb340a66d0.jpg" alt="Logo">
            <div><h2>IRCTC</h2><p>RAILWAY BOOKING</p></div>
        </div>
        <ul class="nav-list">
            <li><a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
            <li><a href="search-train.html" class="active"><i class="fas fa-search"></i> Search Trains</a></li>
            <li><a href="my-bookings.html"><i class="fas fa-ticket-alt"></i> My Bookings</a></li>
            <li><a href="profile.html"><i class="fas fa-user-circle"></i> My Profile</a></li>
        </ul>
    </aside>

    <main class="main">
        <div class="search-box">
            <h2 style="margin-bottom: 25px; font-size: 20px; font-weight: 800;">Find Your Train</h2>
            <div class="search-grid">
                <div class="form-group">
                    <label>From Station</label>
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" id="fromInput" placeholder="Enter source station" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>To Station</label>
                    <i class="fas fa-location-arrow"></i>
                    <input type="text" id="toInput" placeholder="Enter destination" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Travel Date</label>
                    <i class="fas fa-calendar-alt"></i>
                    <input type="date" id="dateInput">
                </div>
                <button class="btn-search" onclick="searchTrains()">Search Trains</button>
            </div>
        </div>

        <div id="resultsArea">
            <div class="no-results">
                <i class="fas fa-train fa-3x"></i>
                <h3>Start Your Search</h3>
                <p>Enter journey details above to see available trains and schedules.</p>
            </div>
        </div>
    </main>

    <script>
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');
        const dateInput = document.getElementById('dateInput');

        let stationList = [];
        let currentSchedules = [];

        async function fetchStations() {
            try {
                const res = await fetch('/api/stations');
                if (res.ok) {
                    const stations = await res.json();
                    stationList = stations.map(s => `${s.stationName} (${s.stationCode})`);
                    setupAutocomplete(fromInput, stationList);
                    setupAutocomplete(toInput, stationList);
                }
            } catch (e) { console.error("Error fetching stations", e); }
        }

        function setupAutocomplete(inp, arr) {
            inp.addEventListener("input", function(e) {
                let a, b, i, val = this.value;
                closeAllLists();
                if (!val) return false;
                a = document.createElement("DIV");
                a.setAttribute("id", this.id + "autocomplete-list");
                a.setAttribute("class", "autocomplete-items");
                this.parentNode.appendChild(a);
                for (i = 0; i < arr.length; i++) {
                    if (arr[i].toUpperCase().includes(val.toUpperCase())) {
                        b = document.createElement("DIV");
                        b.innerHTML = arr[i].replace(new RegExp(val, 'gi'), "<strong>$&</strong>");
                        b.innerHTML += "<input type='hidden' value='" + arr[i] + "'>";
                        b.addEventListener("click", function(e) {
                            inp.value = this.getElementsByTagName("input")[0].value;
                            closeAllLists();
                        });
                        a.appendChild(b);
                    }
                }
            });
            function closeAllLists(elmnt) {
                var x = document.getElementsByClassName("autocomplete-items");
                for (var i = 0; i < x.length; i++) {
                    if (elmnt != x[i] && elmnt != inp) { x[i].parentNode.removeChild(x[i]); }
                }
            }
            document.addEventListener("click", e => closeAllLists(e.target));
        }

        async function searchTrains() {
            const from = fromInput.value;
            const to = toInput.value;
            const date = dateInput.value;
            if (!from || !to || !date) { alert("Please fill all fields"); return; }

            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = '<div class="no-results"><i class="fas fa-spinner fa-spin fa-2x"></i><br>Finding best trains...</div>';

            try {
                const fromName = from.includes('(') ? from.substring(0, from.indexOf('(')).trim() : from;
                const toName = to.includes('(') ? to.substring(0, to.indexOf('(')).trim() : to;

                const res = await fetch(`/api/schedules/search?from=${encodeURIComponent(fromName)}&to=${encodeURIComponent(toName)}&date=${date}`);
                if (res.ok) {
                    currentSchedules = await res.json();
                    displayResults(currentSchedules);
                }
            } catch (e) { resultsArea.innerHTML = '<div class="no-results"><h3>Error searching trains.</h3></div>'; }
        }

        function displayResults(schedules) {
            const area = document.getElementById('resultsArea');
            if (schedules.length === 0) {
                area.innerHTML = '<div class="no-results"><h3>No trains found for this route/date.</h3></div>';
                return;
            }

            area.innerHTML = "";
            schedules.forEach((s, idx) => {
                const t = s.train;
                const card = document.createElement('div');
                card.className = 'train-card';
                card.innerHTML = `
                    <div class="train-header">
                        <div class="train-name"><h3>${t.trainName}</h3><p>#${t.trainNumber} | Runs Daily</p></div>
                        <div class="train-fare"><h4>₹${t.sleeperFare || 500}</h4><p>Base Fare</p></div>
                    </div>
                    <div class="route-visual">
                        <div class="time-box"><h4>${t.departureTime}</h4><p>${t.source}</p></div>
                        <div class="route-path"><i class="fas fa-long-arrow-alt-right"></i><p style="font-size:10px">${s.journeyDate}</p></div>
                        <div class="time-box" style="text-align:right"><h4>${t.arrivalTime}</h4><p>${t.destination}</p></div>
                    </div>
                    <div class="class-options" id="classes-${idx}">
                        ${renderClass(idx, 'SL', 'Sleeper', t.sleeperFare, s.availableSeats)}
                        ${renderClass(idx, '3A', 'AC 3 Tier', t.ac3Fare, s.availableSeats - 5)}
                        ${renderClass(idx, '2A', 'AC 2 Tier', t.ac2Fare, s.availableSeats - 10)}
                    </div>
                    <button class="btn-continue" id="btn-${idx}" onclick="proceedBooking(${idx})">Select & Continue</button>
                `;
                area.appendChild(card);
            });
        }

        function renderClass(idx, code, name, fare, avl) {
            if (!fare) return '';
            return `
                <div class="class-btn" onclick="selectClass(${idx}, '${code}', ${fare}, this)">
                    <strong>${code}</strong>
                    <span>AVL ${avl > 0 ? avl : 'WL'}</span>
                    <p>₹${fare}</p>
                </div>
            `;
        }

        let selectedBooking = null;

        function selectClass(idx, code, fare, element) {
            const parent = element.parentElement;
            parent.querySelectorAll('.class-btn').forEach(b => b.classList.remove('selected'));
            element.classList.add('selected');

            document.getElementById(`btn-${idx}`).style.display = 'block';

            const schedule = currentSchedules[idx];
            selectedBooking = {
                train: schedule.train,
                journeyDate: schedule.journeyDate,
                classType: code,
                fare: fare
            };
        }

        function proceedBooking(idx) {
            if (!selectedBooking) return;
            localStorage.setItem("selectedTrain", JSON.stringify(selectedBooking.train));
            localStorage.setItem("classType", selectedBooking.classType);
            localStorage.setItem("selectedFare", selectedBooking.fare);
            localStorage.setItem("journeyDate", selectedBooking.journeyDate);
            window.location.href = 'booking.html';
        }

        fetchStations();
    </script>
</body>
</html>
